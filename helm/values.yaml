# Umbrella values — override per subchart
discovery:
  # Native Kubernetes DNS discovery (#1756); Consul is no longer required in dev or prod
  type: k8s
  clusterDomain: svc.cluster.local

api:
  enabled: true
auth:
  enabled: true
notifications:
  enabled: true
indexer:
  enabled: true
next-app:
  enabled: true
