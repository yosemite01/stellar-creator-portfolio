[package]
name = "stellar-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "stellar-api"
path = "src/main.rs"

[dependencies]
actix-web.workspace = true
actix-cors = "0.7"
actix-ws = "0.4"
actix-rt.workspace = true
actix-web-httpauth.workspace = true
actix-web-prom = "0.10"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
clap.workspace = true
dotenvy.workspace = true
futures.workspace = true
jsonwebtoken.workspace = true
hmac = "0.13"
# Pinned below the workspace default (0.11): hmac 0.12 depends on the 0.10
# line of the `digest` crate, and sha2 0.11 implements the newer 0.11 line —
# using the workspace version here makes HmacSha256::new_from_slice's trait
# bounds unsatisfiable (Sha256 from two different semver-incompatible sha2
# releases are two different types as far as trait resolution is concerned).
sha2 = "0.11"
hex.workspace = true
soroban-sdk.workspace = true
reqwest.workspace = true
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
tokio-tungstenite = "0.30"
prometheus = { version = "0.14", features = ["process"] }
utoipa = "6"
deadpool-redis = "0.23"
subtle = "2"

# The `integration` feature gates tests that require a real PostgreSQL instance.
# In CI, `cargo test -p stellar-api --features integration` runs these tests.
# Locally: see backend/README.md § "Running integration tests locally".
[features]
integration = []

[dev-dependencies]
actix-http = "3"
tokio-test = { workspace = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
