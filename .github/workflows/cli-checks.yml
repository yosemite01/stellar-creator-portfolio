name: CLI checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cli-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run frontend Orbit-style lint
        run: pnpm run frontend:orbit-check

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.74.0
        with:
          components: clippy

      - name: Run backend clippy
        run: pnpm run backend:clippy

      - name: Run smart contract clippy
        run: pnpm run smart-contract:clippy
