# CI workflow: cli-checks
# Purpose: Runs frontend lint+build (Orbit-style checks) and Rust/Soroban
# clippy across the backend and smart-contract workspaces on every push/PR
# to main. Catches type errors, lint violations, and clippy warnings before
# they reach the main CI matrix.
name: CLI checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cli-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run frontend Orbit-style lint
        run: pnpm run frontend:orbit-check

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run backend clippy
        run: pnpm run backend:clippy

      - name: Run smart contract clippy
        run: pnpm run smart-contract:clippy
