name: Mobile E2E (Maestro)

# Issue #1623: sign-in and bounty-browsing flows, run against a real
# Android emulator in CI (not a simulator/unit-test mock) so a regression
# in either flow is actually caught, not just in the JS logic.
#
# Builds a debug APK from the "e2e" eas.json build profile — locally
# (`expo prebuild` + Gradle), not an EAS cloud build, so this job needs no
# EAS credentials. That profile sets EXPO_PUBLIC_E2E_TEST_MODE=1, which is
# what lets .maestro/sign-in-flow.yaml get through wallet-signature auth
# without a real wallet app installed on the emulator — see the comment on
# useWalletAuth.ts's fallbackToWallet() for why that's safe.
#
# See mobile/docs/E2E_TESTING.md to run these flows locally.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-e2e.yml'

concurrency:
  group: mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive
        working-directory: mobile
        env:
          EXPO_PUBLIC_APP_VARIANT: e2e
          EXPO_PUBLIC_E2E_TEST_MODE: '1'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build debug APK (e2e profile)
        run: ./gradlew :app:assembleDebug
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_APP_VARIANT: e2e
          EXPO_PUBLIC_E2E_TEST_MODE: '1'

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run E2E flows on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r mobile/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test mobile/.maestro/sign-in-flow.yaml
            maestro test mobile/.maestro/browse-bounties-flow.yaml

      - name: Upload Maestro debug artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-debug-output
          path: ~/.maestro/tests
          if-no-files-found: ignore
          retention-days: 14
