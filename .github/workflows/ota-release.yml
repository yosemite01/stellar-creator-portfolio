name: OTA Release

# #603 — Build, diff, encrypt, and publish an OTA patch on every merge to main.
# Consumers pull the manifest from OTA_MANIFEST_URL and apply the patch
# on-device without going through App Store review.
#
# #1626 — staging and production are separate OTA channels so a staging
# build can never reach production devices:
#   - `push` to `main`      -> the `staging` channel, fully automatic (same
#     as before #1626, just namespaced).
#   - a GitHub `release` being `published` -> the `production` channel,
#     gated on the `production` GitHub Environment's required reviewers —
#     mirroring how `deploy-mainnet.yml` requires a deliberate release
#     before anything reaches Mainnet. A merge to `main` alone never
#     promotes to production.
# Each channel writes to its own S3 prefix (`bundles/<channel>/`,
# `patches/<channel>/`, `manifest-<channel>.json`) and diffs only against
# its own previous bundle, so a staging release can't be built as a patch
# on top of production's bundle (or vice versa) and clients pinned to one
# channel's manifest URL never see the other channel's updates.

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ota-release.yml'
  release:
    types: [published]

concurrency:
  # Separate concurrency groups per channel: a staging push and a
  # production release are unrelated and must not block or cancel each
  # other.
  group: ota-release-${{ github.event_name == 'release' && 'production' || 'staging' }}
  cancel-in-progress: false   # never cancel a release mid-flight

jobs:
  build-and-publish:
    name: Build → Diff → Encrypt → Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The production channel requires approval from the `production`
    # GitHub Environment's reviewers (configure them in repo Settings ->
    # Environments); the staging channel has no gate, matching the
    # automatic-on-main-push behaviour this workflow always had.
    environment: ${{ github.event_name == 'release' && 'production' || 'staging' }}

    env:
      OTA_BUCKET: ${{ secrets.OTA_S3_BUCKET }}
      OTA_AES_KEY: ${{ secrets.OTA_AES_KEY }}   # 64-char hex (32 bytes)
      AWS_REGION: ${{ secrets.AWS_REGION }}
      # `staging` on every push to main, `production` only when promoted via
      # a published release. All S3 paths below are namespaced by this so
      # the two channels never share a bundle, patch or manifest.
      OTA_CHANNEL: ${{ github.event_name == 'release' && 'production' || 'staging' }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2   # need HEAD and HEAD~1 for diffing

      # ── Node / pnpm ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mobile

      # ── Export JS bundle ────────────────────────────────────────────────────
      - name: Export Expo bundle
        run: npx expo export --platform all --output-dir dist
        working-directory: mobile
        env:
          EXPO_PUBLIC_OTA_MANIFEST_URL: ${{ secrets.OTA_MANIFEST_URL }}
          EXPO_PUBLIC_OTA_AES_KEY: ${{ secrets.OTA_AES_KEY }}

      # ── Download previous bundle for diffing ────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download previous bundle
        id: prev
        run: |
          aws s3 cp "s3://${OTA_BUCKET}/bundles/${OTA_CHANNEL}/current.bundle" prev.bundle || echo "no-prev=true" >> "$GITHUB_OUTPUT"

      # ── Generate bsdiff patch ────────────────────────────────────────────────
      - name: Install bsdiff
        run: sudo apt-get install -y bsdiff

      - name: Generate differential patch
        run: |
          BUNDLE_PATH=$(find mobile/dist -name '*.bundle' | head -1)
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"
          if [ -f prev.bundle ]; then
            bsdiff prev.bundle "$BUNDLE_PATH" patch.bin
          else
            # First release: patch IS the full bundle
            cp "$BUNDLE_PATH" patch.bin
          fi

      # ── Encrypt patch with AES-256-GCM ──────────────────────────────────────
      - name: Encrypt patch
        id: encrypt
        run: |
          IV=$(openssl rand -hex 12)
          TAG_FILE=tag.bin

          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const key = Buffer.from(process.env.OTA_AES_KEY, 'hex');
            const iv = Buffer.from('$IV', 'hex');
            const plain = fs.readFileSync('patch.bin');
            const cipher = crypto.createCipheriv('aes-256-gcm', key, iv);
            const enc = Buffer.concat([cipher.update(plain), cipher.final()]);
            const tag = cipher.getAuthTag();
            fs.writeFileSync('patch.enc', enc);
            fs.writeFileSync('$TAG_FILE', tag.toString('hex'));
          "

          TAG=$(cat $TAG_FILE)
          SHA256=$(sha256sum "$BUNDLE_PATH" | awk '{print $1}')
          VERSION=$(node -p "require('./mobile/package.json').version")
          PATCH_SIZE=$(wc -c < patch.enc)

          echo "iv=$IV"           >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256"   >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "patch_size=$PATCH_SIZE" >> "$GITHUB_OUTPUT"

      # ── Upload patch and manifest ────────────────────────────────────────────
      - name: Upload encrypted patch
        run: |
          aws s3 cp patch.enc \
            "s3://${OTA_BUCKET}/patches/${OTA_CHANNEL}/${{ steps.encrypt.outputs.version }}.enc" \
            --content-type application/octet-stream

      # ── Sign manifest with Ed25519 ───────────────────────────────────────────
      # OTA_SIGNING_KEY must be stored as a repository secret containing the
      # base64-encoded Ed25519 private key (32-byte seed, not the full 64-byte
      # keypair). Generate once with:
      #   node -e "
      #     const {generateKeyPairSync} = require('crypto');
      #     const {privateKey} = generateKeyPairSync('ed25519');
      #     const der = privateKey.export({type:'pkcs8',format:'der'});
      #     // Last 32 bytes of the PKCS#8 DER are the raw seed
      #     console.log(der.slice(-32).toString('base64'));
      #   "
      # Store the printed value as the OTA_SIGNING_KEY secret.
      # Store the matching base64 public key as OTA_SIGNING_PUBLIC_KEY and
      # bundle it in the mobile app at build time so clients can verify.
      - name: Sign manifest
        id: sign
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          node -e "
            const crypto = require('crypto');
            const fs = require('fs');

            // Reconstruct the Ed25519 private key from the 32-byte seed stored
            // in the secret (base64-encoded).
            const seed = Buffer.from(process.env.OTA_SIGNING_KEY, 'base64');
            if (seed.length !== 32) {
              throw new Error('OTA_SIGNING_KEY must be a base64-encoded 32-byte Ed25519 seed');
            }

            // Node's crypto accepts raw Ed25519 seeds via the 'jwk' or
            // PKCS#8 DER route. Easiest: wrap seed in a minimal PKCS#8 DER.
            // PKCS#8 header for Ed25519 (RFC 8410):
            //   30 2e 02 01 00 30 05 06 03 2b 65 70 04 22 04 20 <32-byte seed>
            const pkcs8Header = Buffer.from(
              '302e020100300506032b657004220420', 'hex'
            );
            const pkcs8Der = Buffer.concat([pkcs8Header, seed]);
            const privKey = crypto.createPrivateKey({
              key: pkcs8Der,
              format: 'der',
              type: 'pkcs8',
            });

            // Sign the canonical manifest payload (all fields except
            // 'signature' itself, sorted by key for determinism).
            const payload = {
              channel:        '${{ env.OTA_CHANNEL }}',
              iv:             '${{ steps.encrypt.outputs.iv }}',
              minBaseVersion: '1.0.0',
              patchSize:      ${{ steps.encrypt.outputs.patch_size }},
              patchUrl:       'https://${OTA_BUCKET}.s3.${AWS_REGION}.amazonaws.com/patches/${{ env.OTA_CHANNEL }}/${{ steps.encrypt.outputs.version }}.enc',
              sha256:         '${{ steps.encrypt.outputs.sha256 }}',
              tag:            '${{ steps.encrypt.outputs.tag }}',
              version:        '${{ steps.encrypt.outputs.version }}',
            };
            const canonical = JSON.stringify(payload, Object.keys(payload).sort());
            const sig = crypto.sign(null, Buffer.from(canonical), privKey);
            fs.writeFileSync('manifest_sig.txt', sig.toString('base64'));
          "
          echo "signature=$(cat manifest_sig.txt)" >> "$GITHUB_OUTPUT"

      - name: Write and upload manifest
        run: |
          cat > manifest.json <<EOF
          {
            "channel": "${OTA_CHANNEL}",
            "version": "${{ steps.encrypt.outputs.version }}",
            "patchUrl": "https://${OTA_BUCKET}.s3.${AWS_REGION}.amazonaws.com/patches/${OTA_CHANNEL}/${{ steps.encrypt.outputs.version }}.enc",
            "sha256": "${{ steps.encrypt.outputs.sha256 }}",
            "iv": "${{ steps.encrypt.outputs.iv }}",
            "tag": "${{ steps.encrypt.outputs.tag }}",
            "patchSize": ${{ steps.encrypt.outputs.patch_size }},
            "minBaseVersion": "1.0.0",
            "signature": "${{ steps.sign.outputs.signature }}"
          }
          EOF
          aws s3 cp manifest.json \
            "s3://${OTA_BUCKET}/manifest-${OTA_CHANNEL}.json" \
            --content-type application/json \
            --cache-control "no-cache, no-store"

      # ── Promote current bundle for next diff ─────────────────────────────────
      # Namespaced per channel: staging's "current" bundle must never become
      # the diff base for a production patch, and vice versa.
      - name: Promote bundle to current
        run: |
          aws s3 cp "$BUNDLE_PATH" \
            "s3://${OTA_BUCKET}/bundles/${OTA_CHANNEL}/current.bundle"

      - name: Summary
        run: |
          echo "### OTA Release — \`${OTA_CHANNEL}\` channel — ${{ steps.encrypt.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Channel: \`${OTA_CHANNEL}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Patch size: ${{ steps.encrypt.outputs.patch_size }} bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA-256: \`${{ steps.encrypt.outputs.sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ed25519 signature: \`${{ steps.sign.outputs.signature }}\`" >> "$GITHUB_STEP_SUMMARY"
